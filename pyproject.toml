[project]
name = "eaos-monorepo"
version = "0.1.0"
description = "Enterprise Architecture Operating System - Root Orchestrator"
readme = "README.md"
requires-python = ">=3.14, <3.15"
license = { text = "Proprietary" }
authors = [
    { name = "EAOS Engineering Team", email = "arch@eaos.internal" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.0",
    "typer>=0.9.0",
    "structlog>=25.1.0",
    "rich>=13.0.0",
    "eaos-api",
    "eaos-web-app",
    "eaos-agent-app",
    "eaos-cli-app",
    "eaos-desktop-app",
    "eaos-knowledge",
    "eaos-identity",
    "eaos-evolution",
    "eaos-reflection",
    "eaos-learning",
    "eaos-prediction",
    "eaos-simulation",
    "eaos-self-rewrite",
    "eaos-autonomous",
    "eaos-capability",
    "eaos-specification",
    "eaos-workflow",
    "eaos-agent",
    "eaos-memory",
    "eaos-federation",
    "eaos-tenancy",
    "eaos-exchange",
    "eaos-marketplace",
    "eaos-intelligence",
    "eaos-civilization",
    "eaos-platforms",
    "eaos-designs",
    "eaos-locales",
    "eaos-platform",
    "eaos-kernel",
    "eaos-engine",
    "eaos-tools",
    "eaos-l2l-bus",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "minio>=7.2.20",
    "google-antigravity>=0.1.8",
    "pyyaml>=6.0.3",
    "pydantic-settings>=2.14.2",
    "bcrypt>=5.0.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-exporter-otlp-proto-http>=1.23.0",
    "neo4j>=5.18.0",
    "jinja2>=3.1.6",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = []

[tool.uv]
managed = true
package = false
default-groups = ["dev"]

# IMPORTANT:
# Do not use "apps/*" here because apps/runtime is runtime data,
# not a Python workspace package.
workspace = { members = [
    "apps/api",
    "apps/agent",
    "apps/cli",
    "apps/desktop",
    "apps/web",
    "apps/automation",
    "apps/ledger",

    "packages/*",

    "platforms",
    "designs",
    "locales",
    "kernel",
    "engine",
    "tools",
    "capabilities",
    "governances",
    "federations",
    "observabilitys",
    "securitys",
    "agents",
    "ai",
    "runtime",
    "schemas",
    "sdk",
    "validation",
    "services"
] }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.15.21",
    "mypy>=1.8.0",
    "taskipy>=1.12.0",
    "httpx>=0.28.1",
    "types-pyyaml>=6.0.12.20260724",
    "pytest-playwright>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true
show-fixes = true
output-format = "concise"

src = [
    "apps",
    "packages",
    "kernel",
    "engine",
    "tools",
    "platforms",
    "capabilities",
    "governances",
    "federations",
    "observabilitys",
    "securitys",
    "agents",
    "ai",
    "runtime",
    "schemas",
    "sdk",
    "validation",
    "services",
    "designs",
    "locales"
]

exclude = [
    ".venv",
    "venvss",
    "build",
    "dist",
    "generated",
    ".git",
    "venv",
    ".ruff_cache",
    ".pytest_cache",
    ".pytest_tmp",
    ".mypy_cache",
    "runtime/tmp",
    ".eaos-repair-backup",
    ".vscode",
    ".github",
    ".eaos_contract_backup_20260808_185550",
    ".eaos_backups",
    ".memory",
    ".agents"
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "RET",
    "RUF",
    "PIE",
    "PERF",
    "S"
]

ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    "S101",
    "S102",
    "S105",
    "S106",
    "S107",
    "S108",
    "S110",
    "S112",
    "S310",
    "S311",
    "S603",
    "S607"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true
warn_unused_configs = true
warn_unused_ignores = true
warn_no_return = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true
show_error_codes = true
pretty = true

exclude = [
    "^build/",
    "^dist/",
    "^\\.venv/",
    "^\\.pytest_cache/",
    "^\\.mypy_cache/",
    "^generated/",
    "main\\.py$"
]

[tool.taskipy.tasks]
doctor = "python -m tools.doctor.main"
validate = "python -m apps.cli.main validate"
control_plane = "python -m apps.cli.main control-plane"
server = "python -m uvicorn apps.api.app.main:app --host 0.0.0.0 --port 8000"
run = "python -m kernel.runtime.main"
lint = "python -m ruff check --fix --unsafe-fixes . && python -m mypy apps/ kernel/ engine/ packages/ tools/ platforms/ capabilities/ governances/ federations/ observabilitys/ securitys/"
format = "python -m ruff format ."
test = "python -m pytest tests/"
clean = "python -c \"import shutil, pathlib; [p.unlink() for p in pathlib.Path('.').rglob('*.py[co]')]; [shutil.rmtree(p) for p in pathlib.Path('.').rglob('.pytest_cache') if p.is_dir()]; [shutil.rmtree(p) for p in pathlib.Path('.').rglob('.pytest_tmp') if p.is_dir()]\""
graph = "python -m apps.cli.main graph"
metrics = "python -m apps.cli.main metrics"
time_machine = "python -m apps.cli.main time-machine"
time-machine = "python -m apps.cli.main time-machine"
twin = "python -m apps.cli.main twin"
compile = "python -m apps.cli.main compile-spec"
loop = "python -m apps.cli.main loop"
dlm = "python -m apps.cli.main dlm"

[tool.uv.sources]
eaos-api = { workspace = true }
eaos-web-app = { workspace = true }
eaos-agent-app = { workspace = true }
eaos-cli-app = { workspace = true }
eaos-desktop-app = { workspace = true }
eaos-knowledge = { workspace = true }
eaos-identity = { workspace = true }
eaos-evolution = { workspace = true }
eaos-reflection = { workspace = true }
eaos-learning = { workspace = true }
eaos-prediction = { workspace = true }
eaos-simulation = { workspace = true }
eaos-self-rewrite = { workspace = true }
eaos-autonomous = { workspace = true }
eaos-capability = { workspace = true }
eaos-specification = { workspace = true }
eaos-workflow = { workspace = true }
eaos-agent = { workspace = true }
eaos-memory = { workspace = true }
eaos-federation = { workspace = true }
eaos-tenancy = { workspace = true }
eaos-exchange = { workspace = true }
eaos-marketplace = { workspace = true }
eaos-intelligence = { workspace = true }
eaos-civilization = { workspace = true }
eaos-platforms = { workspace = true }
eaos-designs = { workspace = true }
eaos-locales = { workspace = true }
eaos-platform = { workspace = true }
eaos-kernel = { workspace = true }
eaos-engine = { workspace = true }
eaos-tools = { workspace = true }
eaos-l2l-bus = { workspace = true }

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "packages",
    "apps",
    "platforms",
    "capabilities",
    "tools",
    "kernel",
    "engine",
    "governances",
    "federations",
    "observabilitys",
    "securitys",
    "agents",
    "ai",
    "runtime"
]

addopts = "-ra -q --tb=short --basetemp=runtime/tmp -p no:warnings"

testpaths = [
    "tests",
    "fitness"
]

tmp_path_retention_count = 1
tmp_path_retention_policy = "none"

[tool.poe.tasks]
sanitize = "python fix_syntax.py"
lint = [
    "sanitize",
    "ruff check --fix",
    "ruff format"
]
check-security = "python scripts/check_invisible_chars.py"