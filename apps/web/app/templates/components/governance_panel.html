<div class="p-5 bg-slate-900 border border-slate-800 rounded-lg space-y-4">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-semibold text-cyan-300">Constitutional Governance & Topology</h2>
        <button onclick="auditTopology()" class="px-3 py-1 bg-cyan-600/20 hover:bg-cyan-600/40 text-cyan-300 text-[10px] font-semibold rounded border border-cyan-500/30 transition-colors">
            Audit Topology
        </button>
    </div>
    <div id="audit-result" class="p-3 bg-slate-950 font-mono text-[11px] text-slate-400 rounded border border-slate-800">
        Click 'Audit Topology' to inspect monorepo connectivity.
    </div>
</div>

<script>
    async function auditTopology() {
        const box = document.getElementById('audit-result');
        box.innerHTML = "Auditing monorepo directory connectivity...";
        try {
            const res = await fetch("http://localhost:8000/governance/topology/audit");
            const data = await res.json();
            box.innerHTML = `<span class="text-emerald-400">Status: ${data.status}</span><br/>Connectivity OK.`;
        } catch (err) {
            box.innerHTML = `<span class="text-rose-400">Topology audit failed.</span>`;
        }
    }
</script>
