<div class="p-5 bg-slate-900 border border-slate-800 rounded-lg space-y-4">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-semibold text-rose-400">Resilience & Chaos Engineering</h2>
        <button onclick="triggerChaosCycle()" class="px-3 py-1 bg-rose-600/20 hover:bg-rose-600/40 text-rose-300 text-[10px] font-semibold rounded border border-rose-500/30 transition-colors">
            Run Chaos Cycle
        </button>
    </div>
    <div class="flex gap-2">
        <button onclick="injectFault('DATABASE_DISCONNECT')" class="flex-1 px-3 py-2 bg-slate-950 hover:bg-slate-800 text-xs rounded border border-slate-800 text-slate-300">
            Inject DB Fault
        </button>
        <button onclick="injectFault('NETWORK_LATENCY')" class="flex-1 px-3 py-2 bg-slate-950 hover:bg-slate-800 text-xs rounded border border-slate-800 text-slate-300">
            Inject Latency
        </button>
    </div>
</div>

<script>
    async function triggerChaosCycle() {
        const log = document.getElementById('console-log');
        if (!log) return;
        log.innerHTML += `<p class="text-rose-400">> [CHAOS] Triggering automated resilience cycle...</p>`;
        try {
            const res = await fetch("http://localhost:8000/chaos/daemon/cycle", { method: 'POST' });
            const data = await res.json();
            log.innerHTML += `<p class="text-emerald-300">[CHAOS] Cycle status: SUCCESS</p>`;
        } catch (err) {
            log.innerHTML += `<p class="text-rose-400">[ERROR] Chaos cycle failed.</p>`;
        }
        log.scrollTop = log.scrollHeight;
    }

    async function injectFault(type) {
        const log = document.getElementById('console-log');
        if (!log) return;
        log.innerHTML += `<p class="text-rose-400">> [CHAOS] Injecting fault: ${type}...</p>`;
        try {
            await fetch("http://localhost:8000/chaos/inject-fault", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ fault_type: type, target_service: 'CoreService' })
            });
            log.innerHTML += `<p class="text-emerald-300">[CHAOS] Fault injected successfully.</p>`;
        } catch (err) {
            log.innerHTML += `<p class="text-rose-400">[ERROR] Fault injection failed.</p>`;
        }
        log.scrollTop = log.scrollHeight;
    }
</script>
