<div class="p-5 bg-slate-900 border border-slate-800 rounded-lg space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div>
            <h2 class="text-sm font-bold text-cyan-400">Enterprise Capabilities Registry (Real Disk Scan)</h2>
            <p class="text-xs text-slate-400">Scanned dynamically from D:\EAOS\CAPABILITIES</p>
        </div>
        <button onclick="fetchCapabilitiesMap()" class="px-3 py-1.5 bg-cyan-600 hover:bg-cyan-500 text-xs font-semibold rounded text-white transition-colors">
            Rescan Capabilities
        </button>
    </div>
    <div id="capabilities-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 max-h-[550px] overflow-y-auto">
        <p class="text-xs text-slate-500 col-span-full text-center py-8">Scanning disk capabilities...</p>
    </div>
</div>

<script>
    async function fetchCapabilitiesMap() {
        try {
            const res = await fetch(`${API_BASE}/dashboard/capabilities-map`);
            const data = await res.json();
            const grid = document.getElementById('capabilities-grid');
            grid.innerHTML = data.map(c => `
                <div class="p-4 bg-slate-950 rounded-lg border border-slate-800/80 flex flex-col justify-between space-y-3">
                    <div>
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="px-2 py-0.5 rounded bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 font-semibold">${c.category}</span>
                            <span class="font-mono text-slate-500">${c.version}</span>
                        </div>
                        <h3 class="text-sm font-bold text-slate-200 mt-2">${c.name}</h3>
                        <p class="text-xs text-slate-400 mt-1">ID: <code class="text-slate-300">${c.capability_id}</code></p>
                    </div>
                    <div class="flex justify-between items-center text-[10px] pt-2 border-t border-slate-900">
                        <span class="text-emerald-400 font-semibold">● ACTIVE</span>
                        <span class="text-slate-500">API: ${c.has_api_spec ? 'Yes' : 'No'} | Domain: ${c.has_domain_spec ? 'Yes' : 'No'}</span>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error(err);
        }
    }
    fetchCapabilitiesMap();
</script>
