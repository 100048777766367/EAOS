[project]
name = "eaos-fitness"
version = "0.1.0"
description = "EAOS Enterprise Design System, Design Tokens & UX Studio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.14.2",
    "jinja2>=3.1.6",
    "structlog>=25.1.0"
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
