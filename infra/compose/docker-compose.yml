services:
  eaos-postgres:
    image: pgvector/pgvector:pg16
    container_name: eaos-postgres
    restart: always
    environment:
      POSTGRES_DB: eaos
      POSTGRES_USER: eaos
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eaos_secure_pass_2026}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  eaos-redis:
    image: redis:7-alpine
    container_name: eaos-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  eaos-neo4j:
    image: neo4j:5-community
    container_name: eaos-neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  eaos-minio:
    image: minio/minio
    container_name: eaos-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  eaos-qdrant:
    image: qdrant/qdrant:latest
    container_name: eaos-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  eaos-ollama:
    image: ollama/ollama:latest
    container_name: eaos-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  eaos-prometheus:
    image: prom/prometheus:latest
    container_name: eaos-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/etc/prometheus

  eaos-grafana:
    image: grafana/grafana:latest
    container_name: eaos-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  minio_data:
  qdrant_data:
  ollama_data:
  prometheus_data:
  grafana_data:
