<div class="p-5 bg-slate-900 border border-slate-800 rounded-lg space-y-4">
    <h2 class="text-sm font-semibold text-slate-300 border-b border-slate-800 pb-2">Autonomous Agent Fleet</h2>
    <div id="agent-list" class="space-y-3">
        <p class="text-xs text-slate-500">Loading fleet telemetry...</p>
    </div>
</div>

<script>
    async function fetchTelemetry() {
        try {
            const res = await fetch("http://localhost:8000/dashboard/telemetry");
            if (!res.ok) return;
            const data = await res.json();

            const agentList = document.getElementById('agent-list');
            agentList.innerHTML = data.active_agents.map(a => `
                <div class="flex items-center justify-between p-3 bg-slate-950 rounded border border-slate-800/80">
                    <div>
                        <p class="text-xs font-semibold text-slate-200">${a.name}</p>
                        <p class="text-[10px] text-slate-500">ID: ${a.agent_id} | Tasks: ${a.tasks_completed}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] text-slate-400">CPU: ${a.cpu_usage_pct}%</span>
                        <span class="px-2 py-0.5 text-[10px] rounded ${a.status === 'running' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-slate-800 text-slate-400'}">
                            ${a.status.toUpperCase()}
                        </span>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error("Telemetry fetch error:", err);
        }
    }
    fetchTelemetry();
    setInterval(fetchTelemetry, 5000);
</script>
