[project]
name = "eaos-locales"
version = "0.1.0"
description = "EAOS Centralized i18n Translations and Management Engine"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.6.0",
    "structlog>=25.1.0"
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
