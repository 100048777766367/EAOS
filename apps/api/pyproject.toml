[project]
name = "eaos-api"
version = "0.1.0"
description = "EAOS API Gateway"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.13.4",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "eaos-knowledge",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
eaos-knowledge = { workspace = true }