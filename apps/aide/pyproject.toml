[project]
name = "eaos-aide-app"
version = "0.1.0"
description = "EAOS AIDE Enterprise Engineering IDE client application"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.110.0", "jinja2>=3.1.6", "pydantic-settings>=2.14.2"]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
