name: EAOS Quality Gates & CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality-gate:
    name: Code Quality, Strict MyPy & Master Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv & Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.14"
          enable-cache: true

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Ruff Formatter & Linter Check
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run Strict MyPy Type Checking
        run: uv run mypy apps/ kernel/ engine/ packages/ tools/ platforms/ capabilities/ governance/ federation/ observability/ security/

      - name: Run Master Test Suite
        run: uv run task test

      - name: Run Architecture Constitution Validator
        run: uv run task validate
