global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "redis"
    static_configs:
      - targets:
          - "eaos-redis-exporter:9121"

  - job_name: "postgres"
    static_configs:
      - targets:
          - "eaos-postgres-exporter:9187"

  - job_name: "neo4j"
    static_configs:
      - targets:
          - "eaos-neo4j-exporter:2004"

  - job_name: "minio"
    metrics_path: /minio/v2/metrics
    static_configs:
      - targets:
          - "eaos-minio:9000"

  - job_name: "qdrant"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "eaos-qdrant:6333"

  - job_name: "node"
    static_configs:
      - targets:
          - "eaos-node-exporter:9100"
