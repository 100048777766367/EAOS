<div class="p-5 bg-slate-900 border border-slate-800 rounded-lg flex flex-col justify-between space-y-4 flex-1">
    <div>
        <h2 class="text-sm font-semibold text-slate-300 border-b border-slate-800 pb-2">System Kernel Console</h2>
        <div id="console-log" class="mt-3 p-3 bg-slate-950 font-mono text-xs text-emerald-400 rounded border border-slate-800 h-44 overflow-y-auto space-y-1">
            <p class="text-slate-500">[SYSTEM] EAOS Cybernetic Kernel Initialized.</p>
            <p class="text-slate-500">[SYSTEM] Ready for interactive commands (try: 'doctor', 'sync').</p>
        </div>
    </div>

    <!-- Command Form -->
    <form id="command-form" class="flex gap-2">
        <input type="text" id="cmd-input" placeholder="Enter command..."
               class="flex-1 bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-cyan-500 font-mono"/>
        <button type="submit" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-xs font-semibold rounded text-white transition-colors">
            Execute
        </button>
    </form>
</div>

<script>
    document.getElementById('command-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const input = document.getElementById('cmd-input');
        const command = input.value.trim();
        if (!command) return;

        const log = document.getElementById('console-log');
        log.innerHTML += `<p class="text-cyan-400">> ${command}</p>`;

        try {
            const res = await fetch("http://localhost:8000/api/v1/control/execute", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ command: command, target_agent: 'planner' })
            });
            const data = await res.json();
            log.innerHTML += `<p class="text-emerald-300">[RESPONSE] ${data.output}</p>`;
        } catch (err) {
            log.innerHTML += `<p class="text-rose-400">[ERROR] Execution failed.</p>`;
        }

        input.value = '';
        log.scrollTop = log.scrollHeight;
    });
</script>
