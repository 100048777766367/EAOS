receivers:
  otlp:
    protocols:
      grpc:
      http:

  prometheus:
    config:
      scrape_configs:
        - job_name: 'redis'
          static_configs:
            - targets: ['eaos-redis:6379']
        - job_name: 'postgres'
          static_configs:
            - targets: ['eaos-postgres:5432']
        - job_name: 'neo4j'
          static_configs:
            - targets: ['eaos-neo4j:7474']
        - job_name: 'minio'
          metrics_path: /minio/v2/metrics
          static_configs:
            - targets: ['eaos-minio:9000']
        - job_name: 'ollama'
          static_configs:
            - targets: ['eaos-ollama:11434']
        - job_name: 'qdrant'
          metrics_path: /metrics
          static_configs:
            - targets: ['eaos-qdrant:6333']

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
