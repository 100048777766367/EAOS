[project]
name = "eaos-web-app"
version = "0.1.0"
description = "EAOS Web Application Package"
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.110.0",
    "jinja2>=3.1.6",
    "eaos-l2l-bus"
]

[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
